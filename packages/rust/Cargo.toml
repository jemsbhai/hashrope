[package]
name = "hashrope"
version = "0.3.2"
edition = "2021"
authors = ["Muntaser Syed <muntaser@ieee.org>"]
description = "Hash rope: a BB[2/7] balanced binary tree with polynomial hash metadata for O(log n) concat, split, substring hashing, and O(log q) repetition encoding."
license = "MIT"
repository = "https://github.com/jemsbhai/hashrope"
keywords = ["hash", "rope", "data-structure", "polynomial-hash", "mersenne-prime"]
categories = ["data-structures", "algorithms"]
readme = "README.md"

[features]
default = []
bigint = ["dep:num-bigint", "dep:num-traits"]

[dependencies]
num-bigint = { version = "0.4", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

[[bench]]
name = "benchmarks"
harness = false
