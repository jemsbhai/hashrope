name: Python and npm package contracts

on:
  push:
    branches: [master]
    paths:
      - 'packages/python/**'
      - 'packages/npm/**'
      - 'usecases/computational-biology/code'
      - '.gitmodules'
      - '.github/workflows/package-contracts.yml'
  pull_request:
    paths:
      - 'packages/python/**'
      - 'packages/npm/**'
      - 'usecases/computational-biology/code'
      - '.gitmodules'
      - '.github/workflows/package-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-contracts-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-wheels:
    name: Installed Python wheels (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Initialize only the public biology checkout, at the parent's committed
      # gitlink. Do not recursively fetch unrelated/private submodules.
      - name: Check out the pinned biology source
        run: |
          git submodule update --init --depth 1 -- usecases/computational-biology/code
          git submodule status -- usecases/computational-biology/code
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and check both distributions
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/hashrope-dist" packages/python
          python -m build --outdir "$RUNNER_TEMP/hashrope-dist" usecases/computational-biology/code
          python -m twine check --strict "$RUNNER_TEMP/hashrope-dist/"*
      - name: Install only the built wheels in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/hashrope-wheel-env"
          wheel_python="$RUNNER_TEMP/hashrope-wheel-env/bin/python"
          "$wheel_python" -m pip install pytest "$RUNNER_TEMP/hashrope-dist/"*.whl
          "$wheel_python" -m pip check
          echo "WHEEL_PYTHON=$wheel_python" >> "$GITHUB_ENV"
          "$wheel_python" -I - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import sys
          import hashrope
          import hashrope_bio
          for module, distribution in [(hashrope, 'hashrope'), (hashrope_bio, 'hashrope-bio')]:
              location = Path(module.__file__).resolve()
              assert location.is_relative_to(Path(sys.prefix).resolve()), location
              print(distribution, importlib.metadata.version(distribution), location)
          PY
      - name: Test installed core and biology packages
        run: |
          "$WHEEL_PYTHON" -I -m pytest --import-mode=importlib --rootdir "$RUNNER_TEMP" \
            "$GITHUB_WORKSPACE/packages/python/tests" \
            "$GITHUB_WORKSPACE/usecases/computational-biology/code/tests" \
            -q --junitxml="$RUNNER_TEMP/hashrope-python-tests.xml"
          "$WHEEL_PYTHON" -I "$GITHUB_WORKSPACE/packages/python/scripts/verify_release.py"

  npm-tarball:
    name: npm source and installed tarball (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11.1', '24']
    defaults:
      run:
        shell: bash
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict build and complete source suite
        run: npm test
      - name: Inspect the distributable tarball
        run: npm run pack:verified
      - name: Exercise installed ESM and CommonJS packages
        # Includes the published-wheel oracle, exact/profile regressions,
        # declaration checks, all documented TypeScript examples, an ES2022
        # browser bundle, and an isolated VM. A real browser is optional and
        # explicitly reported by the consumer harness when unavailable.
        run: npm run test:consumer
